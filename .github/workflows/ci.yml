name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  workflow-syntax:
    name: signal-watch expression regression
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned actionlint
        run: |
          curl --fail --silent --show-error --location \
            --output /tmp/actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  /tmp/actionlint.tar.gz' | sha256sum --check
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
      - name: Check current guard and reject invalid historical pattern
        run: bash scripts/check-signal-watch.sh /tmp/actionlint

  python:
    name: python tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        working-directory: python
        run: pip install -e ".[test]"
      - name: Run tests
        working-directory: python
        run: pytest tests/ -v

  javascript:
    name: javascript interop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Run JavaScript suites including real local HTTP admission
        working-directory: javascript
        run: |
          node tests/interop.test.mjs
          node tests/replay.test.mjs
          node tests/http.test.mjs
          node tests/signals.test.mjs
          node tests/local-admission.test.mjs

  cross-language:
    name: js issue -> python verify
    runs-on: ubuntu-latest
    needs: [python, javascript]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Install python
        working-directory: python
        run: pip install -e ".[test]"
      - name: JS issues + solves
        working-directory: javascript
        run: node tests/interop.test.mjs
      - name: Python verifies the JS artifacts
        working-directory: python
        run: |
          PYTHONPATH=. python3 - <<'PY'
          import json
          from maxwells_defense.core import Challenge, Solution, verify_solution
          with open("/tmp/maxwell-interop.json") as f:
              data = json.load(f)
          verify_solution(
              server_secret=bytes.fromhex(data["secret_hex"]),
              challenge=Challenge.from_dict(data["challenge"]),
              solution=Solution.from_dict(data["solution"]),
              expected_context_id=data["expected_context_id"],
          )
          print("[ok] cross-language verified")
          PY
