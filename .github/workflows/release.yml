name: release

# Publishes the Python and JavaScript packages to PyPI and npm
# on a tag matching v*.*.*.
#
# Required repository secrets:
#   PYPI_API_TOKEN  — PyPI project-scoped token for maxwells-defense
#   NPM_TOKEN       — npm automation token for @viridis-security/maxwells-defense

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.1.0)"
        required: true

jobs:
  pypi:
    name: publish to PyPI
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist + wheel
        working-directory: python
        run: |
          pip install --upgrade pip build twine
          python -m build
          twine check dist/*
      - name: Publish via PyPI API token
        if: ${{ env.PYPI_API_TOKEN != '' }}
        working-directory: python
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: twine upload dist/*
      - name: Skip notice (no token configured)
        if: ${{ env.PYPI_API_TOKEN == '' }}
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          echo "::warning::PYPI_API_TOKEN not set — built artifacts not uploaded."
          ls -la python/dist/

  npm:
    name: publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
      - name: Verify package version
        working-directory: javascript
        run: node -e "console.log('publishing version:', require('./package.json').version)"
      - name: Publish
        if: ${{ env.NPM_TOKEN != '' }}
        working-directory: javascript
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public
      - name: Skip notice (no token configured)
        if: ${{ env.NPM_TOKEN == '' }}
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: echo "::warning::NPM_TOKEN not set — package not published."
