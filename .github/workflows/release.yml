name: release

# Publishes maxwells-defense to PyPI (Python) and npm (JavaScript).
#
# Triggers
#   - push of a version tag  (e.g. v0.1.1)  -> normal release
#   - workflow_dispatch                     -> manual; from `main` it
#     publishes whatever version the package files declare (used for the
#     first v0.1.0 publish, since the v0.1.0 tag predates this workflow).
#
# Required repository secrets
#   PYPI_API_TOKEN  -- PyPI API token (uploaded as user __token__)
#   NPM_TOKEN       -- npm automation token with publish rights to the
#                      @viridis-security scope
#
# Each publish job SKIPS its upload step gracefully when its token is
# absent, so the workflow stays green before the secrets exist and either
# package can be released independently.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-python:
    name: publish python -> PyPI
    runs-on: ubuntu-latest
    env:
      PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify tag matches package version
        if: github.ref_type == 'tag'
        working-directory: python
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          echo "tag=$tag  pyproject=$pkg"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag ($tag) != pyproject version ($pkg)"
            exit 1
          fi

      - name: Test
        working-directory: python
        run: |
          pip install -e ".[test]"
          pytest tests/ -q

      - name: Build + check
        working-directory: python
        run: |
          pip install --upgrade build twine
          python -m build
          twine check dist/*

      - name: Publish to PyPI
        if: ${{ env.PYPI_API_TOKEN != '' }}
        working-directory: python
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ env.PYPI_API_TOKEN }}
        run: twine upload --non-interactive dist/*

      - name: PyPI token absent
        if: ${{ env.PYPI_API_TOKEN == '' }}
        run: echo "::warning::PYPI_API_TOKEN not set - built and checked, did not upload."

  publish-js:
    name: publish javascript -> npm
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Verify tag matches package version
        if: github.ref_type == 'tag'
        working-directory: javascript
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          echo "tag=$tag  package.json=$pkg"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag ($tag) != package.json version ($pkg)"
            exit 1
          fi

      - name: Interop test
        working-directory: javascript
        run: node tests/interop.test.mjs

      - name: Assemble package files
        working-directory: javascript
        run: cp ../LICENSE ../NOTICE ../README.md ../THEOREMS.md .

      - name: Publish to npm
        if: ${{ env.NPM_TOKEN != '' }}
        working-directory: javascript
        env:
          NODE_AUTH_TOKEN: ${{ env.NPM_TOKEN }}
        run: npm publish --access public

      - name: npm token absent
        if: ${{ env.NPM_TOKEN == '' }}
        run: echo "::warning::NPM_TOKEN not set - tested and assembled, did not publish."
