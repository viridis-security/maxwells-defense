name: Secret scan

on: [push, pull_request]

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks v8.21.2
        shell: bash
        run: |
          set -euo pipefail
          download_dir="$(mktemp -d)"
          trap 'rm -rf "$download_dir"' EXIT
          archive="$download_dir/gitleaks.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
            --output "$archive"
          printf '%s  %s\n' \
            5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba \
            "$archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$download_dir" gitleaks
          mkdir -p "$RUNNER_TEMP/gitleaks-bin"
          install -m 0755 "$download_dir/gitleaks" "$RUNNER_TEMP/gitleaks-bin/gitleaks"
          printf '%s\n' "$RUNNER_TEMP/gitleaks-bin" >> "$GITHUB_PATH"

      - name: Scan Git history
        run: gitleaks git . --no-banner --redact
