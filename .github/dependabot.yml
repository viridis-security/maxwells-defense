version: 2
updates:
- package-ecosystem: pip
  directories:
  - /python
  schedule:
    interval: monthly
  open-pull-requests-limit: 5
  cooldown:
    default-days: 7
  ignore:
  - dependency-name: '*'
    update-types:
    - version-update:semver-major
  groups:
    security:
      applies-to: security-updates
      patterns:
      - '*'
    minor-and-patch:
      update-types:
      - minor
      - patch
  versioning-strategy: increase-if-necessary
- package-ecosystem: npm
  directories:
  - /examples/express-middleware
  - /javascript
  schedule:
    interval: monthly
  open-pull-requests-limit: 5
  cooldown:
    default-days: 7
  ignore:
  - dependency-name: '*'
    update-types:
    - version-update:semver-major
  groups:
    security:
      applies-to: security-updates
      patterns:
      - '*'
    minor-and-patch:
      update-types:
      - minor
      - patch
  versioning-strategy: increase-if-necessary
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: monthly
  cooldown:
    default-days: 7
  groups:
    github-actions:
      patterns:
      - '*'
