name: invalid-job-env-regression
on: push
permissions: {}
jobs:
  notify:
    if: ${{ env.WEBHOOK != '' }}
    runs-on: ubuntu-latest
    env:
      WEBHOOK: fixture-only
    steps:
      - run: ':'
