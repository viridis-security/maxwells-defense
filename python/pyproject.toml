[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "maxwells-defense"
version = "0.2.0"
description = "SHA-256 proof-of-work defense for AI agents. Constant verification work in difficulty; tunable classical search effort under a random-oracle model."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "Viridis Security", email = "viridissecurity1@gmail.com" },
]
keywords = [
    "proof-of-work",
    "ai-agents",
    "rate-limiting",
    "captcha",
    "ddos",
    "agent-security",
    "thermodynamics",
    "landauer",
    "viridis-security",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7.0", "pytest-asyncio>=0.21", "setuptools>=64", "wheel"]
fastapi = ["starlette>=0.27"]
redis = ["redis>=4.5"]

[project.urls]
Homepage = "https://github.com/viridis-security/maxwells-defense"
Issues = "https://github.com/viridis-security/maxwells-defense/issues"
Source = "https://github.com/viridis-security/maxwells-defense"

[tool.setuptools.packages.find]
where = ["."]
include = ["maxwells_defense*"]

[tool.setuptools.package-data]
maxwells_defense = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.isort]
known-first-party = ["maxwells_defense"]
